<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">local-image-gen：你的登录，直接开画</title>
  <desc id="desc">终端提示词经过本地编排模块，转化为一张完成的山景图像。</desc>
  <defs>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090b" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#08090b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#08090b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0d10" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#12100e" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <image href="backgrounds/03-prompt-to-file.png" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="430" fill="url(#topShade)"/>
  <rect x="0" y="770" width="1600" height="130" fill="url(#footer)"/>
  <rect x="0" y="890" width="1600" height="10" fill="#ee9b2f"/>

  <g transform="translate(64 45)" filter="url(#shadow)">
    <image href="../../docs/logo.svg" width="68" height="68"/>
    <text x="91" y="29" fill="#ffffff" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="24" font-weight="750">local-image-gen</text>
    <text x="91" y="56" fill="#aaa7a1" font-family="SFMono-Regular, Menlo, monospace" font-size="14">CLI + PORTABLE SKILL</text>
  </g>

  <text x="64" y="183" fill="#ffffff" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="800">你的登录，直接开画。</text>
  <text x="66" y="230" fill="#d5d0c7" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23">先用已有订阅登录，再按需使用自己的官方 API Key</text>

  <g transform="translate(72 421)">
    <text x="92" y="0" fill="#ffffff" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23">local-image-gen \</text>
    <text x="37" y="42" fill="#ffffff" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23">"电影感城市夜景" \</text>
    <text x="37" y="84" fill="#ffffff" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23">--aspect-ratio 16:9</text>
    <text x="37" y="126" fill="#b6b3ad" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">--quality high -o outputs/city.png</text>
  </g>

  <g transform="translate(64 796)" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="0" y="24" fill="#ffffff" font-size="20" font-weight="700">本地编排</text>
    <circle cx="104" cy="18" r="3" fill="#ee9b2f"/>
    <text x="124" y="24" fill="#ffffff" font-size="20" font-weight="700">显式路由</text>
    <circle cx="228" cy="18" r="3" fill="#ee9b2f"/>
    <text x="248" y="24" fill="#ffffff" font-size="20" font-weight="700">Python 3.9+，仅标准库</text>
    <text x="0" y="62" fill="#a8a5a0" font-size="15">不是免费生图网关；生成会消耗所选后端的配额或账单。</text>
  </g>
  <text x="1532" y="839" text-anchor="end" fill="#f2eee7" font-family="SFMono-Regular, Menlo, monospace" font-size="18">github.com/DandreYang/local-image-gen</text>
</svg>
