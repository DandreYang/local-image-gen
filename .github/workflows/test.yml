name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python tests/test_local_image_gen.py
      - name: Studio backend
        run: python tests/test_studio_job.py
      - name: Studio frontend contracts
        run: python tests/test_studio_frontend.py
      - name: Studio server launch
        run: python tests/test_studio_server.py
      - name: Studio sidecar
        run: python tests/test_studio_sidecar.py
      - name: Studio CSRF and uploads
        run: python tests/test_studio_security.py
      - name: Studio composite
        run: python tests/test_studio_composite.py
      - name: Studio overlay geometry
        run: python tests/test_studio_overlay_geom.py
      - name: Studio phase 3
        run: python tests/test_studio_phase3.py
      - name: Studio phase 4
        run: python tests/test_studio_phase4.py
      - name: CLI contract
        run: |
          python scripts/local_image_gen.py --version
          python scripts/local_image_gen.py --list-models
          python scripts/local_image_gen.py --help
          python scripts/local_image_gen.py --doctor
          bash -n install.sh
          ./install.sh --help
          ./install.sh --dry-run
