name: test

on:
  push:
    branches: [main, "prototype/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-python v7 只保留未 EOL 的 Python 测试矩阵；本仓仍承诺 3.9，停在 v6（已是 Node 24）。
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full Python suite
        run: python -m unittest discover -s tests
      - name: CLI contract
        run: |
          python scripts/local_image_gen.py --version
          python scripts/local_image_gen.py --list-models
          python scripts/local_image_gen.py --help
          python scripts/local_image_gen.py --doctor
          bash -n install.sh
          ./install.sh --help
          ./install.sh --dry-run

  studio-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/future-studio-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototypes/future-studio-v1/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run build:local
      - run: npm test
      - run: npm run test:sites
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-playwright
          path: |
            prototypes/future-studio-v1/playwright-report/
            prototypes/future-studio-v1/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Generated local client is current
        working-directory: .
        run: git diff --exit-code -- studio/client

  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Full Python suite
        run: python -m unittest discover -s tests
      - name: CLI smoke
        run: |
          python scripts/local_image_gen.py --version
          python scripts/local_image_gen.py --list-models
          python scripts/local_image_gen.py --doctor
